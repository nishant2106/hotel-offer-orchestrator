services:
  app:
    build: .
    command: npm start
    depends_on:
      - redis
      - temporal
    environment:
      PORT: 3000
      REDIS_URL: redis://redis:6379
      SERVICE_BASE_URL: http://app:3000
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: hotel-offers
    ports:
      - "3000:3000"

  worker:
    build: .
    command: npm run worker:prod
    depends_on:
      - app
      - temporal
    environment:
      REDIS_URL: redis://redis:6379
      SERVICE_BASE_URL: http://app:3000
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_TASK_QUEUE: hotel-offers

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    ports:
      - "5432:5432"

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      - temporal-postgres
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
